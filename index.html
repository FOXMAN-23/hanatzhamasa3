<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אתר הנצחה - מסע ישראלי מחזור כ"ט</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #121212;
            color: #f0f0f0;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            position: relative;
            z-index: 1;
            overflow-x: hidden;
        }

        /* סמל מגן דוד וכלנית ברקע */
        .watermark-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
        }

        .watermark-star {
            font-size: 85vh;
            color: rgba(255, 255, 255, 0.02);
            position: absolute;
        }

        .watermark-kalanit {
            width: 35vh;
            height: 35vh;
            position: absolute;
            opacity: 0.15;
        }

        header {
            background-color: rgba(15, 15, 15, 0.85);
            padding: 50px 20px;
            text-align: center;
            border-bottom: 2px solid #8b0000;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #d4af37;
            margin: 0 0 10px 0;
            font-size: 3.5em;
            font-weight: 700;
        }

        .quote {
            font-size: 1.4em;
            color: #8b0000;
            font-weight: 600;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* אזור הסינון */
        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 50px;
        }

        select {
            padding: 14px 25px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #444;
            background: rgba(30, 30, 30, 0.8);
            color: #fff;
            width: 100%;
            max-width: 350px;
            font-family: inherit;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #d4af37;
        }

        /* רשת הכרטיסיות */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .card {
            background-color: rgba(30, 30, 30, 0.7);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
            cursor: pointer;
            border: 1px solid #2a2a2a;
            text-align: center;
            opacity: 0;
            animation: fadeIn 1s forwards;
            backdrop-filter: blur(5px);
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #8b0000;
        }

        .card-img {
            width: 100%;
            height: 300px;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            object-fit: cover;
            object-position: top;
        }

        .card-content {
            padding: 25px 20px;
        }

        .card h3 {
            margin: 0 0 8px 0;
            color: #ffffff;
            font-size: 1.6em;
            font-weight: 600;
        }

        .card p {
            margin: 0;
            color: #d4af37;
            font-size: 1.1em;
        }

        /* חלון קופץ */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: #161616;
            max-width: 750px;
            width: 100%;
            border-radius: 8px;
            padding: 50px 40px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 35px;
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #fff;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 20px;
        }

        .modal-header h2 {
            color: #d4af37;
            margin: 0 0 10px 0;
            font-size: 2.2em;
        }

        .modal-header p {
            color: #999;
            margin: 0;
            font-size: 1.2em;
        }

        .modal-section {
            margin-bottom: 30px;
        }

        .modal-section h4 {
            color: #d4af37;
            margin: 0 0 15px 0;
            font-size: 1.4em;
        }

        .modal-section p {
            color: #dcdcdc;
            line-height: 1.8;
            font-size: 1.1em;
            white-space: pre-wrap;
            margin: 0;
        }

        .memory-text {
            text-align: center;
            margin-top: 40px;
            color: #d4af37;
            font-size: 1.5em;
            font-weight: bold;
            border-top: 1px solid #2a2a2a;
            padding-top: 20px;
        }

        /* עיצוב נרות הזיכרון */
        .candle-section {
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 40px;
            margin-top: 50px;
            text-align: center;
        }

        .candle-section h2 {
            color: #d4af37;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .candle-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 160px;
            margin-bottom: 25px;
        }

        .candle-body {
            width: 45px;
            height: 110px;
            background: linear-gradient(to right, #e2e2e2, #ffffff, #e2e2e2);
            border-radius: 4px;
            position: relative;
            box-shadow: inset 0 -15px 15px rgba(0,0,0,0.1), 0 5px 10px rgba(0,0,0,0.5);
        }

        .candle-body::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 10px;
            background: #222;
        }

        .flame {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 38px;
            background: radial-gradient(ellipse at bottom, #fff 10%, #fcdc12 40%, #ff6a00 80%, transparent);
            border-radius: 50% 50% 20% 20%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            filter: blur(1px);
        }

        .flame.lit {
            opacity: 1;
            animation: flicker 1.5s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); opacity: 0.9; box-shadow: 0 0 20px rgba(255, 106, 0, 0.4); }
            100% { transform: translateX(-50%) scale(1.05); opacity: 1; box-shadow: 0 0 40px rgba(255, 106, 0, 0.7), 0 0 80px rgba(255, 106, 0, 0.3); }
        }

        .light-btn {
            background-color: #2a2a2a;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 12px 35px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: bold;
        }

        .light-btn:hover {
            background-color: #d4af37;
            color: #111;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .candle-message {
            color: #d4af37;
            font-size: 1.3em;
            margin-top: 15px;
            min-height: 30px;
            opacity: 0;
            transition: opacity 1.5s ease;
        }

        .candle-message.show {
            opacity: 1;
        }

        /* עיצוב נר אישי בחלון הקופץ */
        .modal-candle-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 30px;
            padding-top: 20px;
        }
        
        .modal-candle-wrapper .candle-container {
            height: 120px;
            transform: scale(0.8);
            margin-bottom: 10px;
        }

        .modal-candle-wrapper .candle-message {
            font-size: 1.1em;
            margin-top: 10px;
        }

        /* התאמות למסכים קטנים (פלאפונים) */
        @media (max-width: 768px) {
            header { padding: 35px 15px 25px; }
            h1 { font-size: 2.2em; }
            .quote { font-size: 1.1em; }
            
            .container { padding: 25px 15px; }
            .search-container { margin-bottom: 35px; }
            select { max-width: 100%; font-size: 15px; padding: 12px 20px; }
            
            .grid { gap: 20px; grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
            .card-img { height: 250px; }
            .card-content { padding: 20px 15px; }
            
            .modal-content { 
                padding: 40px 20px 30px; 
                width: 95%; 
                max-height: 90vh;
                border-radius: 12px;
            }
            .modal-header h2 { font-size: 1.8em; }
            .modal-header p { font-size: 1.1em; }
            .modal-section h4 { font-size: 1.2em; }
            .modal-section p { font-size: 1.05em; line-height: 1.6; }
            .memory-text { font-size: 1.3em; margin-top: 30px; }
            
            .candle-section { padding: 30px 15px; }
            .candle-section h2 { font-size: 1.6em; }
            .light-btn { padding: 10px 25px; font-size: 16px; width: 100%; max-width: 250px; }
        }

        /* עיצוב בר גלילה */
        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-track { background: #111; }
        .modal-content::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="watermark-container">
        <div class="watermark-star">✡</div>
        <svg class="watermark-kalanit" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path d="M100,100 C60,10 140,10 100,100 Z" fill="#ff2a2a"/>
            <path d="M100,100 C190,40 180,120 100,100 Z" fill="#d11111"/>
            <path d="M100,100 C150,190 70,190 100,100 Z" fill="#ff2a2a"/>
            <path d="M100,100 C20,130 30,50 100,100 Z" fill="#d11111"/>
            <circle cx="100" cy="100" r="18" fill="#111"/>
            <circle cx="100" cy="100" r="22" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3"/>
        </svg>
    </div>

    <header>
        <h1>מסע ישראלי - מחזור כ״ט</h1>
        <div class="quote">בְּמוֹתָם צִוּוּ לָנוּ אֶת הַחַיִּים</div>
    </header>

    <div class="container">
        <div class="search-container">
            <select id="locationFilter" onchange="filterCards()">
                <option value="">כל המקומות</option>
                <option value="נובה">מסיבת הנובה</option>
                <option value="יישובי העוטף">יישובי העוטף</option>
                <option value="עזה">רצועת עזה</option>
                <option value="גבול הצפון">גבול הצפון / לבנון</option>
                <option value="בעת שירותו">מקומות אחרים / בעת שירותם</option>
            </select>
        </div>

        <div class="grid" id="cardsGrid"></div>

        <div class="candle-section">
            <h2>נר זיכרון לכלל נופלי המלחמה</h2>
            <div class="candle-container">
                <div class="candle-body">
                    <div class="flame" id="virtualFlame"></div>
                </div>
            </div>
            <button class="light-btn" id="lightBtn" onclick="lightCandle()">הדליקו נר לזכרם</button>
            <div class="candle-message" id="candleMsg">הדלקתם נר לזכר כל נופלי המלחמה. יהי זכרם ברוך.</div>
        </div>
    </div>

    <!-- החלון הקופץ -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal(true)">&times;</span>
            <div class="modal-header">
                <h2 id="modalName">שם החלל</h2>
                <p id="modalLocation">מקום נפילה</p>
            </div>
            
            <div class="modal-section">
                <h4 id="modalLifeStoryTitle">סיפור חייו</h4>
                <p id="modalLifeStory"></p>
            </div>
            
            <div class="modal-section">
                <h4>סיפור הנפילה</h4>
                <p id="modalFallStory"></p>
            </div>

            <div id="modalMemory" class="memory-text"></div>
            
            <!-- נר זיכרון אישי בתוך הכרטיסייה -->
            <div class="modal-candle-wrapper">
                <div class="candle-container">
                    <div class="candle-body">
                        <div class="flame" id="modalVirtualFlame"></div>
                    </div>
                </div>
                <button class="light-btn" id="modalLightBtn" onclick="lightModalCandle()">הדליקו נר אישי</button>
                <div class="candle-message" id="modalCandleMsg"></div>
            </div>

        </div>
    </div>

    <script>
        const fallenHeroes = [
            {
                name: "דור מלכה",
                gender: "male",
                category: "נובה",
                location: "נובה",
                imageUrl: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcStM2zjXtl2MnFrlCEMVpT-Fo7QmV8m73V6nJ6efP2FGA&s=10",
                lifeStory: `15/03/1994 - 07/10/2023\n\n״הודו על קיומנו ותחיו אהבה״, זה היה אחד המשפטים שהשאיר אחריו דור כמורשת. משפחתו מספרת שדור היה ילד של אהבה, ילד שהחיוך לא ירד לרגע מהפנים שלו. ילד אהוב, רגיש, ילד של אנשים, של חברות ושמחה.\n\nדור גדל באילת, ילד משפחתי מאד, בן להוריו אבי ובתיה, אח קטן לבר ואח גדול לרותם. אהב את משפחתו יותר מכל דבר בעולם. למרות היותו קטן מבר, הוא היה דואג לה ושומר עליה כאילו היה הבכור. דאג לכל מחסורה וחלק איתה קשר מיוחד שאי אפשר לתאר במילים. הם אף חלקו את אותו הטעם בבגדים ואופנה.\n\nעם השנים החל לשחק כדורגל ואף שיחק בקבוצת הכדורגל בני אילת. אהבתו לכדורגל הביאה אותו ללמוד גם את משחק הפוצ'יוולי והוא הדריך ילדים רבים. אהבתו לספורט עברה גם לדור הצעיר שאותו לימד והדריך. בלכתו השאיר אחריו עדת מעריצים גדולה שכוללת ילדים וגם מבוגרים שזכו ללמוד ממנו.\n\nלאחר שירותו הצבאי עבר קורס אבטחת אישים ועבד באבטחה בשדה התעופה באילת. דור אהב לטייל בעולם. לפני כחצי שנה נסע לטייל בהודו, שם חווה חוויות מיוחדות ובין השאר למד את מקצוע הצורפות ולאחרונה הכין תכשיטים מיוחדים וגם בגדים ומכר אותם. הוא חלם לפתוח חנות מיוחדת שבה ימכור את המוצרים שהכין.`,
                fallStory: `לצערנו דור לא הצליח להגשים את חלומו, ואנחנו נשארנו ללא החיוך והחום שלו. הוא נסע לפסטיבל הנובה, שם מכר את תכשיטיו, בסיוע חבר ילדות שלו, דור אביטן הי"ד.\n\nדור יכול היה לברוח ברגע שבו התחילה ההתקפה, אך הוא בחר להישאר כדי לעזור ולהציל אחרים. הלב הגדול שלו לא אפשר לו לברוח ולהשאיר אחריו אנשים שעלולים לקפח את חייהם והוא השתמש בידע שלו כחובש כדי לטפל בפצועים בשטח. לפי הסיפורים שהגיעו להוריו דור הציל לפחות שתי בנות שנפצעו במסיבה.\n\nהערך שמשפחתו של דור הייתה רוצה שניקח ממנו הוא אהבת חינם, אהבת האחר. דור היה תמיד דואג לכולם, ולא יכול היה לסבול את העובדה שמישהו אחר סובל או כואב. הלוואי שנהיה ראויים לו.`
            },
            {
                name: "דור אביטן",
                gender: "male",
                category: "נובה",
                location: "נובה",
                imageUrl: "https://storage.googleapis.com/ynet---iron-swords-memories.appspot.com/website%2Fimages%2F6548dd900103829469db66bf%2F65413df1bfd06a9a1b696a7d_%D7%93%D7%95%D7%A8%20%D7%90%D7%91%D7%99%D7%98%D7%9F.jpg",
                lifeStory: `01/05/1997 - 07/10/2023\n\nדור היה יפה תואר, היו לו עיניים כחולות כמו הים, הוא אהב את הפשטות שבחיים, כישרוני בטירוף, ידע כמעט הכל.. איש אשכולות כזה.. היה לו לב ענק, אהב לעזור לכולם, חברותי מאוד! היו לו המון חברים!\n\nדור הוא הילד הבכור, אח לרון ואורי. דור גדל לצד אורי, הילד המיוחד שלנו, אורי נער אוטיסט בן 18.5 נמצא ב"גדולים במדים". דור היה מבלה איתו לא מעט. הוא היה מנגן בגיטרה ואורי היה שר..\n\nדור עבר לא מעט טלטלות בחייו, אך תמיד היתה לו הדרך לשרוד דרך המוסיקה. היו קשיים בדרך.. אך היו גם המון הצלחות ושאיפות שרק חלק הספיק לממש. דור היה מופיע בבארים בעיר, היה שר ומנגן ומשמח אנשים. ערכיו של דור היו בולטים ואי אפשר היה לפספס את הענווה שבו, את הקסם הזה, היכולת לראות אדם הזקוק לעזרה.. הוא לא היה שופט, הוא היה מקבל כל אדם באשר הוא.\n\nבשנתיים האחרונות דור נכנס לתקופה היפה בחייו, בילה יותר בחיק המשפחה והתקדם מאוד במוסיקה שכל כך אהב, הוא עבר את האודישנים ל״כוכב הבא״ והיה אמור להשתתף בתוכנית. לדור היתה חברה, שירז, אהובת ליבו. הוא רצה וחלם על חתונה, בית ומשפחה…`,

                lifeStory: `29/05/1995 - 07/10/2023\n\nניצן גולדנברג, בנם של יסכה תשבי וירון גולדנברג, אחיהם של הדר וצוף, נולד באילת ב־29 במאי 1995. בגיל 15, לאחר גירושי הוריו, עבר ניצן עם אמו ואחותו הצעירה צוף לנתניה, שם המשיך את חייו והתבגרותו.\n\nניצן היה ילד של אור, תנועה, סקרנות ואהבת אדם. הייתה בו שמחת חיים טבעית, לב פתוח, חוש צדק עמוק ורצון אמיתי לעזור. הוא לא עבר בעולם באדישות. הוא ראה אנשים, הרגיש את החלש, והאמין שהחזק נועד להגן, לא לשלוט. בכל מקום שאליו הגיע הביא איתו חום, הומור, חיבור ונוכחות חיה. הייתה בו אנרגיה מיוחדת, כזו שמחברת בין אנשים וגורמת להם להרגיש שרואים אותם.\n\nכבר מגיל צעיר נמשך ניצן לעולם המכונות, הרכב והדיוק הטכני. הוא למד מכונאות רכב בכפר הנוער “הדסה נעורים”, ובהמשך המשיך ללימודי י״ג–י״ד במסגרת העתודה הטכנולוגית, אותם סיים בהצטיינות כהנדסאי רכב. עבורו רכב לא היה רק מכונה, אלא עולם של תנועה, הבנה, הקשבה וחיבור בין מערכות.\n\nניצן שירת כלוחם טכני ביחידת דובדבן, בשירות הסדיר ובמילואים. גם שם באו לידי ביטוי הערכים שהובילו אותו: אחריות, נאמנות, מקצועיות, אומץ וחברות אמיתית. הוא היה אדם שאפשר לסמוך עליו. אדם שנכנס לעומק הדברים, מבין את המערכת, מתקן, מחזק ונשאר שם בשביל אחרים.\n\nלצד הדיוק הטכני הייתה בו נפש חופשייה. ניצן אהב מוזיקה, קצב וכלי נגינה שבטיים ואפריקאיים. הוא ניגן בתופים ובדרבוקות, אהב קפוארה, תנועה, טבע, מרחבים וטיולים. הוא השתתף בפעילויות לשמירת הסביבה ולניקוי חופים, אהב את הארץ, ואף יצא לבדו למסע בשביל ישראל בצפון. בטבע מצא שקט. במרחב מצא נשימה. בדרך מצא את עצמו.\n\nניצן היה גם חולם גדול. הוא חלם להגיע ליפן, רצה להיות צלם של נשיונל ג׳יאוגרפיק, והתעניין בפיזיקה, בטכנולוגיה, בחלל ובאפשרות שיש חיים גם מעבר למה שהעין האנושית רואה. הסקרנות שלו לא נעצרה בגבולות המוכר. הוא אהב לשאול, לדמיין, לחקור ולהביט רחוק.\n\nאת עבודת חלומותיו מצא בטסלה ישראל, שם עבד כטכנאי רכב. הוא אהב את עבודתו ודיבר עליה בהתלהבות. הוא היה עובד מצטיין, מקצועי, מסור ואהוב, שסייע לעובדים חדשים להשתלב, ללמוד ולהצליח. בתוך זמן קצר התקדם בתפקידו ונשלח להשתלמות בתחום המתח הגבוה במדריד. גם בעבודתו, כמו בחייו, שילב ניצן בין ידע, לב, אחריות ואהבה אמיתית למה שהוא עושה.`,
                fallStory: `ב־7 באוקטובר 2023 נרצח ניצן במסיבת ה"נובה" ליד רעים. הוא יצא לחגוג חיים, מוזיקה, חופש ואהבה, ונלקח באכזריות מתוך מקום שבו הנשמה שלו הרגישה בבית.\n\nגם לאחר מותו, רוחו של ניצן ממשיכה לפעום דרך מעשים של נתינה וזיכרון. עמותת דובדבן תרמה לזכרו ערכות פריצה לרכבים לחברת “ידידים”, כדי לסייע במקרי חירום ולהציל חיים. זו נתינה שממשיכה את דרכו של ניצן: לראות מצוקה, להגיע בזמן, לפתוח דרך ולהשיב לאדם תחושת ביטחון.\n\nאביו הוציא קבוצת ילדים לטיול בפארק תמנע לזכרו, כמחווה לאהבתו הגדולה של ניצן לטבע, למרחבים ולדרך.\n\nניצן היה הרבה מעבר לפרטים שניתן לכתוב על דף. הוא היה לב פועם. אדם של אור, צדק, חופש, נתינה, סקרנות, טבע ואהבת חיים. מי שפגש אותו זוכר את החיוך, את האנרגיה, את הטוב, ואת התחושה שיש בו משהו נקי, חי ומיוחד. זכרו של ניצן ממשיך לחיות בלב משפחתו, חבריו וכל מי שזכה להכירו.\n\nכפי שבחרה אמו לומר עליו: "כל פרח מתחיל בניצן קטן."`

                lifeStory: `04/04/2004 - 08/12/2023\n\nמאור גדל באילת. למד בבית הספר היסודי "יעלים" ובתיכון "גולדווטר". מגיל צעיר אהב מאוד כדורגל, לתקופה אף שיחק בקבוצת "בני אילת". הקבוצה האהודה עליו ביותר הייתה "ריאל מדריד", ובין השחקנים העריץ במיוחד את רונאלדו.\n\nמאור ניכר בצניעותו, נעים הליכות, אהוד על סביבתו, האמין בצדקת הדרך ונלחם על כך. צעיר אמיץ, שבלט על אף היותו שקט ולא מתלהם, בלט בעשייה ולא במילים. היה אהוב על חבריו אשר מספרים על חבר אמיתי, שבכל אירוע היה הראשון לדאוג ולבדוק אם הכול בסדר.\n\nכנער ציוני שרצה לשמור על המולדת, היה ברור לו שדרכו הצבאית תהיה לוחמה והוא רצה להגיע לחטיבת "גולני". בנוסף, ביקש גם אחרי הצבא לעסוק בפעילות ביטחונית בשב"כ או במוסד. ביום 12.12.2022 התגייס לצה"ל. שירת כלוחם בחטיבת "גולני", גדוד 12. במהלך שירותו עבר הכשרה בבית הספר החטיבתי של גולני ומשם שובץ במחלקה הפיקודית, מחלקה בה מייעדים ומפתחים את הלוחמים להיות מפקדים מובילים בחטיבה.`,
                fallStory: `בשבת כ"ב בתשרי, שמחת תורה תשפ"ד, 7 באוקטובר 2023, בשעה שש וחצי בבוקר, פתח ארגון הטרור חמאס במתקפת פתע על ישראל. בחסות ירי מסיבי של טילים ורקטות מרצועת עזה לאזורים נרחבים בארץ חדרו אלפי מחבלים – יבשתית, ימית ואווירית, והחלו במתקפה רצחנית על יישובי עוטף עזה ועל שדרות, אופקים ונתיבות, על מְבַלי מסיבות טבע סמוך לקיבוצים רעים ונירים, על בסיסי צה"ל ועל העוברים בדרכים באזור. המחבלים רצחו כשמונה-מאות אזרחים בבתיהם, במכוניותיהם, אחרי שביצעו בהם פשעים כבדים. חטפו לרצועת עזה מאות ישראלים והחריבו, בזזו והעלו באש בתים ורכוש. מאות חיילים, שוטרים, אנשי כוחות הביטחון וחברי כיתות הכוננות המקומיות נפלו בקרב. בבוקר זה החלה מלחמה.\n\nכמה ימים אחרי תחילת המלחמה החלה כניסת כוחות צה"ל, ובהם יחידתו של מאור, ללחימה ברצועת עזה. ביום שישי 8.12.2023 מאור וחבריו ניהלו קרב מול מחבלים במסגד בח'אן יונס. טיל נ"ט נורה לעברם, ומאור נהרג. הוא נהרג יום אחרי שנהרג בג'באליה שבצפון רצועת עזה בן דודו, רב-סמל ראשון גל מאיר איזנקוט.\n\nרב-טוראי מאור כהן איזנקוט נפל בקרב ביום כ"ה בכסלו תשפ"ד (8.12.2023). בן תשע-עשרה בנופלו. הובא למנוחות בבית העלמין הצבאי באילת. הותיר אחריו הורים ושני אחים. לאחר נפילתו הועלה לדרגת סמל.\n\nכתבה אימו: "בן אהוב ויקר שהשאיר אחריו לבבות רבים מרוסקים, ואם שכל רצונה להביא לעולם המשכיות של דורות ממנו. נזכור לנצח את מאור, את טוהר אהבתו וצניעותו אשר יאירו דרכינו לעד. גיבור של אימא. אתה תמיד תהיה לי מלך העולם, עם החיוך הכי מושלם".`

                lifeStory: `19/04/1990 - 11/11/2024\n\nאיתמר גדל בעיר אילת. היה תינוק חייכן ומקסים. התחנך בגנים "ניר" ו"גיבורים" ולמד בבית הספר היסודי הוותיק בעיר, "אלמוג". חברותי, רגיש ואהוב על כל הסובבים אותו. ילד סקרן ונבון מאוד, שנהנה לקרוא ספרים ולכתוב סיפורים. מגיל צעיר אהב את הטבע, טיולים ובעלי חיים. המשיך את לימודיו בבית ספר התיכון "גולדווטר" באילת. כנער עסק בספורט לסוגיו השונים, אהב לשחות בים ולצלול, והגיע עם השנים לרמת "דייב מאסטר". בלט בחוש הצדק שלו ובנתינה לחברה. היה חניך, מדריך ומרכז בשבט תנועת הצופים בעיר, שהיה לביתו השני בשנות התיכון. בצופים גם הכיר את בת זוגו, אלמה.\n\nבשנת 2009 התגייס לצה"ל והחל במסלול ההכשרה של שייטת 13. המשיך בפלס"ר (פלוגת סיור) של חטיבה 401 בחיל השריון. לאחר סיום מסלול ההכשרה יצא לקורס קצינים בבסיס הדרכה 1, וכקצין חזר לפקד על צוותו. היה מפקד מחלקת טירונים, קצין מבצעים ביחידתו וכן מפקד צוערים בבית הספר לקצינים. מהשירות הסדיר השתחרר בשנת 2014, בדרגת סגן.\n\nמייד עם תום שירותו הצבאי יצאו איתמר ואלמה לטיול הגדול בדרום אמריקה, למשך חצי שנה. בטיול זכה איתמר לשלב שתי אהבות גדולות: הטבע אשר בפלאיו חזה, בין היתר כאשר טייל ביערות האמזונס וצלל באיי גלאפגוס, וחיבתו למתקני אקסטרים למיניהם. לאחר חזרתו ארצה החל את לימודיו האקדמיים. את השנה הראשונה ללימודים עבר באוניברסיטה העברית בירושלים, ולאחר מכן העתיק את לימודיו לאוניברסיטת בן-גוריון בנגב, בבאר שבע, במסלול כלכלה ומתמטיקה. היה סטודנט מבריק והשלים תואר ראשון ושני בכלכלה בתוכנית ייעודית מקוצרת. שימש מתרגל בפקולטה לניהול, ולאחר מכן מרצה בקמפוס אילת, שלוחה של האוניברסיטה. היה אהוב מאוד על תלמידיו.\n\nבמהלך לימודיו, בשנת 2016, נישא לאלמה והם גרו בבאר שבע. לאחר לידת בנם בכורם, אורי, החליטו לחזור לאילת ולחיות ליד משפחתם המורחבת. כעבור שנים אחדות נולדה בתם השנייה, איילה. איתמר היה בן זוג אוהב ואב מסור לילדיו. נהג להשתולל עימם, ליצור עבורם עולמות דמיון קסומים ולהרכיב עימם טירות ומגדלים. הוא נטע בהם ביטחון רב והוריש להם את אהבתו לספורט ולטבע. איתמר היה בן משפחה מסור וחבר טוב. מעורב, אוהב ואהוב בכל המשפחה, כן שמר על קשר הדוק עם קבוצת חברים, חלקם עוד מימי הגן, בית הספר והצופים.\n\nבמשך מספר שנים עבד כמדריך בקורסי הכנה לבחינה הפסיכומטרית. בשנים 2018–2019 שימש רכז בתוכנית "דילר" למנהיגות נוער של הסוכנות היהודית בקהילת אילת-אילות בשיתוף נוער מטורונטו, קנדה. השלים לימודי הוראה בקמפוס אילת, ובשנת 2022 החל לעבוד כמורה למתמטיקה ומחנך בשכבה י', בבית הספר "גולדווטר", שבו למד בנעוריו. שימש גם רכז הכנה לצה"ל בכיתות הגבוהות, והתלמידים היו קשובים ומרותקים כשהסביר להם על שירות משמעותי וקרבי בצבא. בני הנוער והצעירים שפגש, לימד וחינך מעידים עליו שהיה מורה לחיים, כזה שהותיר את חותמו בחינוך לערכים שהיו עבורו עמודי תווך: אהבת העם והארץ, ציונות, כבוד לזולת, נתינה וקבלת האחר והשונה. הוא היה מורה אכפתי במיוחד, שניהל שיחות אישיות עם התלמידים, הבין לליבם ותמך בכל אחד ואחת מהם. תלמידיו ידעו שהוא מעריך אותם ושהצלחתם חשובה לו. כמה מהם העידו כי התחילו לאהוב מתמטיקה בזכותו. "לא היה לנו מורה כמוהו", אמרה אחת מתלמידותיו.\n\nאיתמר היה בעל תחומי עניין רבים. בזכות אהבתו לספורט הפך למאמן כושר פעיל במכון "קרוספיט" שנפתח באילת. במקביל השתלם בתחום הייעוץ הכלכלי למשפחות והחל ללוות משפחות בתהליכי שינוי כלכלי. תכנן להקים מכינה לחיים האזרחיים לחיילים משוחררים, הכנה ללימודים ולניהול כלכלי נכון. בכל פעילות שבה השתתף, ובכל מקום שבו היה, ביקש להיות משמעותי, מוביל ומשפיע. כך היה גם בשירות המילואים. לאחר מספר שנים ביחידת המילואים של פלס"ר, שבה לחם גם במבצע "צוק איתן" בקיץ 2014, השתלב ביחידת לוט"ר אילת (יחידה 7707), כחלק מרצונו לתרום לביטחון העיר והקהילה. היחידה ללוחמה בטרור הממוקמת באילת היא יחידת עילית של חיילי מילואים, שערוכה לתת מענה לאירועי טרור באזור וכפופה לעוצבת "אדום" בפיקוד הדרום. עם הזמן פיקד איתמר על צוות הצלפים של היחידה.`,
                fallStory: `בשבת כ"ב בתשרי, שמחת תורה תשפ"ד, 7 באוקטובר 2023, בשעה שש וחצי בבוקר, פתח ארגון הטרור חמאס במתקפת פתע על ישראל. בחסות ירי מסיבי של טילים ורקטות מרצועת עזה לאזורים נרחבים בארץ חדרו אלפי מחבלים – יבשתית, ימית ואווירית, והחלו במתקפה רצחנית על יישובי עוטף עזה ועל שדרות, אופקים ונתיבות, על מְבַלי מסיבות טבע סמוך לקיבוצים רעים ונירים, על בסיסי צה"ל ועל העוברים בדרכים באזור. המחבלים רצחו כשמונה-מאות אזרחים בבתיהם, במכוניותיהם, אחרי שביצעו בהם פשעים כבדים. חטפו לרצועת עזה מאות ישראלים והחריבו, בזזו והעלו באש בתים ורכוש. מאות חיילים, שוטרים, אנשי כוחות הביטחון וחברי כיתות הכוננות המקומיות נפלו בקרב. בבוקר זה החלה מלחמה.\n\nבאותו בוקר הוזעק איתמר עם חברים נוספים מהיחידה ללחימה בשטחי עוטף עזה. הם הגיעו לצומת מבטחים, נלחמו במחבלים ובזכות לחימת לוחמי הלוט"ר נפתח הצומת למעבר רכבים וכוחות צה"ל. לאחר מכן נלחמו בקיבוץ סופה הגובל בדרום רצועת עזה וסיכלו חדירת מחבלים אליו, יחד עם כיתת הכוננות של הקיבוץ. בהמשך טיהרו את האזור ממחבלים וחילצו תושבים ופועלים זרים שהסתגרו במרחבים המוגנים ובמפעלים אזוריים. עם הכניסה הקרקעית של צה"ל לרצועת עזה בסוף אוקטובר 2023, שירת איתמר במילואים חודשים ארוכים והשתתף במבצעים רבים בתוך הרצועה.\n\nבכל הפוגה דאג להגיע לבית הספר אל תלמידיו, ואף כתב להם מכתב על חייו כחייל מילואים, שהוקרא בטקס יום הזיכרון לחללי מערכות ישראל ונפגעי פעולות האיבה, ב-13 במאי 2024:\n"שלום לכולם, שמי איתמר, ואני מורה פה בבית הספר. חלקכם ודאי מזהים אותי מהשיעורים, מהמסדרונות ואולי מחדר המורים. אבל לא על זה באתי לספר לכם היום. היום באתי לספר לכם על צד אחר שלי, על המילואימניק שבי. בי, ועוד ברבים אחרים. בשבעה באוקטובר, התעוררתי לאותן חדשות נוראיות שהתעוררנו כולנו. כששמעתי אותן, היה לי ברור. צריכים אותי, עכשיו. אין זמן, יש חיים להציל, וצריכים לפעול מייד. תוך שעות מספר כבר הייתי בשדה הקרב של ה-07/10, ביישובי העוטף. אני ואחיי לנשק קפצנו מאירוע לאירוע, נלחמנו, ואפילו הצלחנו להציל כמה וכמה נפשות בישראל.\n\nרבים שואלים אותי: פחדת? נלחצת? על מה חשבת? ואני תמיד מחזיר את אותה התשובה. באותו הרגע לא חשבתי, כי אילו הם חייו של המילואימניק. ברגע אחד אתה שוכח הכול - אתה כבר לא מורה, לא נגר, לא מנכ"ל ולא נהג מונית. אתה לוחם בצבא ההגנה לישראל. ברגע שקראו לי משהו בראשי השתנה - חשבתי רק איך אני מגיע מוכן, כמה שיותר מהר, כדי לבצע את המשימה שהוטלה עלינו, כדי לעצור את האויב שחדר את גבולות ישראל. המחשבות על השגרה נדמו - הגיע זמן מלחמה. אלו הם חייו של מילואימניק. ברגע אחד אתה קם, עוזב את המשפחה, את העבודה, את החיים ויוצא להילחם. השארתי את ילדיי בבית, ויצאתי. היה לי ברור שאעשה הכול כדי להציל את חיי התושבים בעוטף, גם במחיר חיי שלי. והמחיר הזה כואב. המחשבה על הילדים כואבת. אבל מניחים אותה בצד וממשיכים להסתער. זה המחיר שאנחנו המילואימניקים משלמים בכל פעם מחדש. ואולי אפילו בכל יום. יש לנו משפחה, יש לנו חברים, אבל ברגע האמת אנחנו נעזוב הכול ונתגייס למאמץ המלחמתי.\n\nאל תשכחו אותו, את המחיר הזה. שלנו, חיילי המילואים, של החיילים הסדירים, של כוחות הביטחון, ובייחוד של אלו שנפלו. היו ראויים למחיר אותו אנחנו משלמים. דאגו שתהייה לנו חברה חזקה, מאוחדת, בה מכבדים אחד את השני, בה לכל אחד יש מקום, בה כדאי ואפשר לחיות חיים מאושרים. כי על זה אנחנו נלחמים".\n\nבפעילות של איתמר וצוותו בעיר ג'באליה ביום 11.11.2024, במהלך כניסתו השביעית במספר לשטח הרצועה, זיהה הצוות חוליית מחבלים ופתח לעברה באש מדויקת. זמן קצר לאחר מכן נהרג איתמר מירי צלף. רב-סרן איתמר לוין פרידמן נפל בקרב ביום י' בחשוון תשפ"ה (11.11.2024). בן שלושים וארבע בנופלו. הובא למנוחות בבית העלמין הצבאי בעיר אילת. הותיר אחריו אישה, שני ילדים, הורים ושני אחים.\n\nכתבה אימו: "איתמר השאיר לנו צוואה כפי שכתב לתלמידיו, 'תמשיכו להיות אנשים טובים', וכך נעשה. נהיה טובים ונהיה בשמחה, כי איתמר היה ילד שמח".\n\nכתבה אלמה, אלמנתו: "איתמרי, חצי שנה עברה, והלב עדיין מסרב להאמין. אחד הדברים שלמדתי על החיים החדשים שנכפו עלינו, הוא כמה הם אמביוולנטיים וכמה הזמן הוא מושג חמקמק. איך אפשר למעשה לספור את הימים או החודשים, כשכל רגע ורגע הוא לא רק הרגע הזה או הבא, הוא גם הרגע שהיה בעבר או זה שיכול היה להיות בעתיד? אני מרגישה שמאז שאתה אינך, אני חיה במקביל בכמה צירי זמן. כל פעולה כמעט מלווה בזיכרון של האופן שבו אתה ביצעת אותה. בכל מקום אני רואה לנגד רוחי את הפעמים, לרוב הרבות מספור, שבהן היינו שם יחד...\n\nאיתמרי, למשפחה הקטנה שלנו היה                 lifeStory: `24/06/1959 - 09/06/1982\n\nבן לאה ועמוס, נולד ביום י"ח בסיוון תשי"ט (24.6.1959) בטבעון. בילדותו עבר עם הוריו לאילת, שם קיבל את חינוכו. שנתיים ראשונות למד בבית-הספר "ערבה", עבר לבית-הספר "אלמוג", בו למד ארבע שנים נוספות והשלים את לימודיו התיכוניים בבית-הספר המקיף באילת, במגמת מיכשור ובקרה. בצעירותו סבל מבעיות בריאות, אולם בכוח רצונו התגבר על קשייו. היה פעיל מאוד בשבט הצופים באילת, כחניך וכמדריך, וארגן פעילות ענפה לנוער בעירו.\n\nבאוגוסט 1977 התגייס לצה"ל ושירת בחיל-השריון. אחרי שעבר בהצלחה אימוני טירונות, נשלח לקורס מש"קי טנק ובאוגוסט 1978 הועלה לדרגת סמל. בקיץ 1979 השלים קורס קציני שריון והועלה לדרגת סג"ם. מפקדיו ציינוהו כ"קצין טוב, בעל יכולת וביצועים מרשימים". הוא נתמנה מדריך בקורס קצינים בבית-ספר לשריון ובאוגוסט 1980 הועלה לדרגת סגן.`,

            btn.style.display = 'none';
            msg.classList.add('show');
            
            localStorage.setItem('candleLit', 'true');

                document.getElementById('candleMsg').classList.add('show');

            const genderSuffix = hero.gender === 'female' ? 'ה' : 'ו';

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = ''; 

            fallenHeroes.forEach((hero, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(index);
                card.style.animationDelay = `${index * 0.1}s`;

                const imgHtml = hero.imageUrl 
                    ? `<img src="${hero.imageUrl}" class="card-img" alt="${hero.name}">` 
                    : `<div class="card-img" style="font-size: 4em;">👤</div>`;

                card.innerHTML = `
                    ${imgHtml}
                    <div class="card-content">
                        <h3>${hero.name}</h3>
                        <p>${hero.location}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCards() {
            const locationFilter = document.getElementById('locationFilter').value;
            const cards = document.querySelectorAll('.card');

            cards.forEach((card, index) => {
                const hero = fallenHeroes[index];
                const matchesLocation = locationFilter === "" || hero.category === locationFilter;

                if (matchesLocation) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

            document.getElementById('modalLifeStory').textContent = hero.lifeStory;
            document.getElementById('modalFallStory').textContent = hero.fallStory;

            if (force || event.target.id === 'modalOverlay') {
